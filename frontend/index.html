<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroConnect | Direct Farm-to-Buyer Marketplace</title>
    <meta name="description" content="Connect directly with local farmers in Andhra Pradesh. Farm-fresh paddy, chillies, vegetables, and grains at fair prices with zero middlemen." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var explicit = localStorage.getItem("agroconnectThemeExplicit");
          var stored = localStorage.getItem("agroconnectTheme");
          var isDark = explicit === "true" && stored === "dark";
          if (isDark) {
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.classList.add("dark-theme");
          } else {
            document.documentElement.removeAttribute("data-theme");
            document.documentElement.classList.remove("dark-theme");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
