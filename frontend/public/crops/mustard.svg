<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMustard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF9EE"/>
      <stop offset="50%" stop-color="#F8F2D8"/>
      <stop offset="100%" stop-color="#EFE4BC"/>
    </linearGradient>
    <linearGradient id="bowlWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5832"/>
      <stop offset="50%" stop-color="#6E4020"/>
      <stop offset="100%" stop-color="#48250F"/>
    </linearGradient>
    <radialGradient id="seedGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFDD55"/>
      <stop offset="60%" stop-color="#DE9F18"/>
      <stop offset="100%" stop-color="#8E5E0A"/>
    </radialGradient>
    <filter id="shadowMustard">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#553A10" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgMustard)"/>
  <ellipse cx="200" cy="245" rx="145" ry="24" fill="#664818" opacity="0.14"/>
  
  <g filter="url(#shadowMustard)">
    <!-- Rustic Wood Bowl -->
    <ellipse cx="200" cy="210" rx="125" ry="48" fill="url(#bowlWood)"/>
    <path d="M75,210 C75,248 130,265 200,265 C270,265 325,248 325,210 Z" fill="url(#bowlWood)"/>
    <ellipse cx="200" cy="205" rx="120" ry="42" fill="#502E15"/>
    
    <!-- Mustard Seed Mound -->
    <ellipse cx="200" cy="198" rx="114" ry="38" fill="url(#seedGlow)"/>
    <ellipse cx="200" cy="188" rx="85" ry="26" fill="#F4B826"/>
    
    <!-- Seed Granules Overlay -->
    <circle cx="170" cy="185" r="4" fill="#6B4205"/><circle cx="185" cy="190" r="3.5" fill="#FFE066"/><circle cx="210" cy="182" r="4" fill="#FFE066"/>
    <circle cx="225" cy="188" r="3.8" fill="#6B4205"/><circle cx="195" cy="178" r="4.2" fill="#FFE680"/><circle cx="160" cy="195" r="3.5" fill="#FFE066"/>
    <circle cx="240" cy="194" r="3.5" fill="#FFE066"/><circle cx="180" cy="202" r="4" fill="#6B4205"/><circle cx="220" cy="200" r="3.8" fill="#FFE066"/>
    
    <!-- Yellow Mustard Bloom Flowers above bowl -->
    <path d="M190,140 Q180,90 165,65" stroke="#3D6B24" stroke-width="3" fill="none"/>
    <circle cx="165" cy="65" r="8" fill="#FCD34D"/>
    <circle cx="155" cy="68" r="7" fill="#FDE047"/>
    <circle cx="172" cy="72" r="6.5" fill="#FACC15"/>
    <circle cx="164" cy="76" r="7" fill="#EAB308"/>
    <circle cx="164" cy="70" r="3.5" fill="#854D0E"/>
    
    <path d="M210,140 Q225,95 240,68" stroke="#3D6B24" stroke-width="3" fill="none"/>
    <circle cx="240" cy="68" r="8" fill="#FCD34D"/>
    <circle cx="248" cy="74" r="7" fill="#FDE047"/>
    <circle cx="232" cy="73" r="6.5" fill="#FACC15"/>
    <circle cx="240" cy="78" r="7" fill="#EAB308"/>
    <circle cx="240" cy="73" r="3.5" fill="#854D0E"/>
  </g>
  
  <g transform="translate(30, 32)">
    <rect width="130" height="26" rx="13" fill="#1F4D36" fill-opacity="0.9"/>
    <text x="65" y="17" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">OILSEEDS & SPICE</text>
  </g>
</svg>