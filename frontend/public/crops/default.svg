<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDefault" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EE"/>
      <stop offset="50%" stop-color="#F4EBD8"/>
      <stop offset="100%" stop-color="#E7DAC0"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58B270"/>
      <stop offset="100%" stop-color="#1F4D36"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2A518"/>
      <stop offset="100%" stop-color="#DE8C0A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgDefault)"/>
  
  <!-- Subtle circular organic sun glow -->
  <circle cx="200" cy="130" r="70" fill="url(#sunGrad)" opacity="0.15"/>
  <ellipse cx="200" cy="245" rx="130" ry="20" fill="#3D4D40" opacity="0.1"/>
  
  <!-- Stylized Elegant Organic Sprout & Harvest Emblem -->
  <g transform="translate(200, 140)">
    <path d="M0,60 Q-20,0 -60,-20 Q-10,-40 0,60" fill="url(#leafGrad)"/>
    <path d="M0,60 Q20,10 60,-10 Q30,-45 0,60" fill="url(#leafGrad)"/>
    <path d="M0,60 L0,-35" stroke="#1F4D36" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-45" r="10" fill="#F2A518"/>
  </g>
  
  <text x="200" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#1F4D36" text-anchor="middle" letter-spacing="0.5">AGROCONNECT HARVEST</text>
  <text x="200" y="240" font-family="'Inter', sans-serif" font-size="12" fill="#6B756F" text-anchor="middle">Verified Direct Andhra Produce</text>
</svg>