<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTomato" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF3ED"/>
      <stop offset="50%" stop-color="#F8E5D8"/>
      <stop offset="100%" stop-color="#EFCEBE"/>
    </linearGradient>
    <radialGradient id="tomatoRed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF5C47"/>
      <stop offset="40%" stop-color="#EB2C15"/>
      <stop offset="85%" stop-color="#B51202"/>
      <stop offset="100%" stop-color="#730A00"/>
    </radialGradient>
    <filter id="shadowTomato">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#702010" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgTomato)"/>
  <ellipse cx="200" cy="246" rx="140" ry="24" fill="#602818" opacity="0.14"/>
  
  <g filter="url(#shadowTomato)">
    <!-- Tomato 2: Background left -->
    <circle cx="140" cy="190" r="58" fill="url(#tomatoRed)"/>
    <path d="M140,132 C135,124 125,122 120,126 C126,132 134,136 140,138 C146,136 154,132 160,126 C155,122 145,124 140,132 Z" fill="#2D6A4F"/>
    
    <!-- Main Tomato Front Center -->
    <ellipse cx="225" cy="180" rx="76" ry="72" fill="url(#tomatoRed)"/>
    
    <!-- Tomato Crown / Calyx -->
    <path d="M225,108 C215,92 195,85 185,92 C198,102 212,110 225,114 C238,110 252,102 265,92 C255,85 235,92 225,108 Z" fill="#2D6A4F"/>
    <path d="M225,108 C232,95 240,78 245,60 C238,72 232,88 225,100 Z" fill="#40916C"/>
    <path d="M220,110 C208,102 188,104 175,114 C190,118 206,116 220,110 Z" fill="#2D6A4F"/>
    <path d="M230,110 C242,102 262,104 275,114 C260,118 244,116 230,110 Z" fill="#2D6A4F"/>
    <circle cx="225" cy="110" r="6" fill="#1B4332"/>
    
    <!-- Glossy Highlight Reflection -->
    <ellipse cx="195" cy="148" rx="20" ry="12" fill="#FFA59A" opacity="0.6" transform="rotate(-30 195 148)"/>
    <circle cx="185" cy="142" r="5" fill="#FFFFFF" opacity="0.8"/>
  </g>
  
  <g transform="translate(30, 32)">
    <rect width="128" height="26" rx="13" fill="#1F4D36" fill-opacity="0.9"/>
    <text x="64" y="17" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">VINE TOMATOES</text>
  </g>
</svg>