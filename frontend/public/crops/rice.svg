<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F2"/>
      <stop offset="50%" stop-color="#F5EFE0"/>
      <stop offset="100%" stop-color="#E9DFCA"/>
    </linearGradient>
    <linearGradient id="paddyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEEA9A"/>
      <stop offset="50%" stop-color="#E2B734"/>
      <stop offset="100%" stop-color="#A87814"/>
    </linearGradient>
    <linearGradient id="riceBowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9C7AE"/>
      <stop offset="50%" stop-color="#B39B7C"/>
      <stop offset="100%" stop-color="#826848"/>
    </linearGradient>
    <filter id="shadowRice">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#403018" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgRice)"/>
  <ellipse cx="200" cy="248" rx="140" ry="24" fill="#5A4018" opacity="0.14"/>
  
  <g filter="url(#shadowRice)">
    <!-- Rice Sona Masoori Bowl -->
    <ellipse cx="200" cy="205" rx="115" ry="44" fill="url(#riceBowl)"/>
    <path d="M85,205 C85,248 135,264 200,264 C265,264 315,248 315,205 Z" fill="url(#riceBowl)"/>
    
    <!-- Heap of pristine white rice grains -->
    <ellipse cx="200" cy="195" rx="105" ry="38" fill="#F8F8F4"/>
    <path d="M100,195 Q200,140 300,195 Z" fill="#FFFFFF"/>
    <ellipse cx="200" cy="172" rx="70" ry="22" fill="#FFFFFF"/>
    
    <!-- Texture grains -->
    <ellipse cx="170" cy="170" rx="5" ry="2" fill="#E8E2D5" transform="rotate(25 170 170)"/>
    <ellipse cx="195" cy="162" rx="5" ry="2" fill="#E8E2D5" transform="rotate(-15 195 162)"/>
    <ellipse cx="220" cy="168" rx="5" ry="2" fill="#E8E2D5" transform="rotate(35 220 168)"/>
    <ellipse cx="185" cy="180" rx="5" ry="2" fill="#E8E2D5" transform="rotate(-40 185 180)"/>
    <ellipse cx="210" cy="182" rx="5" ry="2" fill="#E8E2D5" transform="rotate(10 210 182)"/>
    
    <!-- Arching Golden Paddy Stalk across top -->
    <path d="M100,210 Q140,100 240,65 Q290,45 330,75" stroke="#CCA22B" stroke-width="3" fill="none"/>
    <g transform="translate(240, 65)">
      <ellipse cx="-15" cy="0" rx="10" ry="5" fill="url(#paddyGold)" transform="rotate(-20 -15 0)"/>
      <ellipse cx="0" cy="-5" rx="10" ry="5" fill="url(#paddyGold)" transform="rotate(10 0 -5)"/>
      <ellipse cx="15" cy="0" rx="10" ry="5" fill="url(#paddyGold)" transform="rotate(30 15 0)"/>
      <ellipse cx="30" cy="10" rx="10" ry="5" fill="url(#paddyGold)" transform="rotate(45 30 10)"/>
      <ellipse cx="45" cy="24" rx="10" ry="5" fill="url(#paddyGold)" transform="rotate(60 45 24)"/>
      <ellipse cx="58" cy="42" rx="10" ry="5" fill="url(#paddyGold)" transform="rotate(75 58 42)"/>
    </g>
  </g>
  
  <g transform="translate(30, 32)">
    <rect width="134" height="26" rx="13" fill="#1F4D36" fill-opacity="0.9"/>
    <text x="67" y="17" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">AP PADDY & RICE</text>
  </g>
</svg>