<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCarrot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF6ED"/>
      <stop offset="50%" stop-color="#F7ECD9"/>
      <stop offset="100%" stop-color="#EEDAC0"/>
    </linearGradient>
    <linearGradient id="carrotBody" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FF8A24"/>
      <stop offset="60%" stop-color="#E85D04"/>
      <stop offset="100%" stop-color="#BC3908"/>
    </linearGradient>
    <linearGradient id="carrotLeaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55A630"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <filter id="shadowCarrot">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#804010" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgCarrot)"/>
  <ellipse cx="200" cy="246" rx="135" ry="22" fill="#754820" opacity="0.12"/>
  
  <g filter="url(#shadowCarrot)">
    <!-- Foliage Greens -->
    <path d="M185,95 C170,60 145,35 125,20 C135,38 148,65 170,90 Z" fill="url(#carrotLeaf)"/>
    <path d="M195,90 C195,50 188,25 180,10 C190,30 200,60 198,88 Z" fill="#74C69D"/>
    <path d="M205,92 C220,55 240,30 260,18 C248,36 230,65 212,92 Z" fill="url(#carrotLeaf)"/>
    
    <!-- Main Carrot Body -->
    <path d="M165,100 C175,95 220,95 230,100 C235,130 215,220 198,276 C196,280 194,280 192,276 C178,220 160,130 165,100 Z" fill="url(#carrotBody)"/>
    
    <!-- Organic Ridges / Texture Lines -->
    <path d="M172,125 Q195,128 222,123" stroke="#BA3E05" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M176,155 Q196,158 218,153" stroke="#BA3E05" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M180,185 Q197,188 214,183" stroke="#BA3E05" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M185,215 Q197,217 208,213" stroke="#BA3E05" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    
    <!-- Highlight Shimmer -->
    <path d="M175,108 C172,135 180,210 192,260 C190,250 182,180 180,130 C179,115 176,110 175,108 Z" fill="#FFAA5A" opacity="0.45"/>
  </g>
  
  <g transform="translate(30, 32)">
    <rect width="118" height="26" rx="13" fill="#1F4D36" fill-opacity="0.9"/>
    <text x="59" y="17" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">ORGANIC VEG</text>
  </g>
</svg>