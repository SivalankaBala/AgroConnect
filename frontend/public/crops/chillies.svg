<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChillies" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF2E9"/>
      <stop offset="50%" stop-color="#F7E6D6"/>
      <stop offset="100%" stop-color="#EED2BE"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFF9F2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F7E6D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chilliRed1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5238"/>
      <stop offset="50%" stop-color="#D62818"/>
      <stop offset="100%" stop-color="#9E120A"/>
    </linearGradient>
    <linearGradient id="chilliRed2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E83020"/>
      <stop offset="60%" stop-color="#B8180E"/>
      <stop offset="100%" stop-color="#7A0A04"/>
    </linearGradient>
    <linearGradient id="chilliStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E8C3A"/>
      <stop offset="100%" stop-color="#2D5A1E"/>
    </linearGradient>
    <filter id="shadowChilli" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#803020" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgChillies)"/>
  <rect width="400" height="300" fill="url(#sunGlow)"/>
  
  <!-- Subtle organic background curves -->
  <path d="M0,230 Q120,200 240,240 T400,220 L400,300 L0,300 Z" fill="#E8D1BE" opacity="0.35"/>
  <ellipse cx="200" cy="245" rx="140" ry="24" fill="#693020" opacity="0.12"/>
  
  <g filter="url(#shadowChilli)">
    <!-- Chilli 2: Background angled left -->
    <path d="M140,110 C130,140 105,185 125,230 C132,246 148,252 144,258 C138,250 120,238 112,215 C100,180 122,130 135,108 Z" fill="url(#chilliRed2)"/>
    <path d="M140,110 C145,95 152,80 162,72 C164,74 158,88 148,102 Z" fill="url(#chilliStem)"/>
    
    <!-- Chilli 3: Background angled right -->
    <path d="M250,115 C265,145 285,190 270,232 C262,248 248,254 252,260 C258,252 274,240 282,218 C295,182 270,132 255,112 Z" fill="url(#chilliRed2)"/>
    <path d="M255,112 C252,96 244,82 232,74 C230,76 238,90 248,104 Z" fill="url(#chilliStem)"/>

    <!-- Main Front Chilli: Vibrant Guntur Red -->
    <path d="M192,85 C208,82 225,92 222,110 C216,145 235,195 210,248 C198,272 186,280 188,284 C184,278 188,262 195,242 C212,195 198,148 202,112 C204,98 194,90 190,88 Z" fill="url(#chilliRed1)"/>
    
    <!-- Highlight Reflection on Front Chilli -->
    <path d="M208,110 C204,142 220,185 200,235 C197,242 196,238 198,230 C215,185 201,145 204,112 C205,103 207,105 208,110 Z" fill="#FFA590" opacity="0.6"/>
    
    <!-- Stem & Calyx Front -->
    <path d="M188,86 C186,72 178,54 165,42 C163,44 172,60 178,76 C182,82 186,85 188,86 Z" fill="url(#chilliStem)"/>
    <path d="M180,88 C185,82 198,80 205,82 C210,84 212,88 208,94 C198,96 186,94 180,88 Z" fill="#3D732E"/>
  </g>
  
  <!-- Farm fresh label badge element -->
  <g transform="translate(30, 32)">
    <rect width="108" height="26" rx="13" fill="#1F4D36" fill-opacity="0.9"/>
    <text x="54" y="17" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">GUNTUR SPICE</text>
  </g>
</svg>