<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWheat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8EE"/>
      <stop offset="50%" stop-color="#F7EFD4"/>
      <stop offset="100%" stop-color="#EEDCB4"/>
    </linearGradient>
    <linearGradient id="wheatGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE588"/>
      <stop offset="50%" stop-color="#E6B422"/>
      <stop offset="100%" stop-color="#AC770A"/>
    </linearGradient>
    <filter id="shadowWheat">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#735010" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgWheat)"/>
  <ellipse cx="200" cy="250" rx="130" ry="20" fill="#664818" opacity="0.12"/>
  
  <g filter="url(#shadowWheat)">
    <!-- Wheat Stalk 1 (Left Tilt) -->
    <path d="M150,260 Q170,170 140,80" stroke="#CCA028" stroke-width="3" fill="none"/>
    <g transform="translate(140, 80) rotate(-15)">
      <ellipse cx="0" cy="0" rx="9" ry="16" fill="url(#wheatGold)"/>
      <ellipse cx="-7" cy="18" rx="8" ry="14" fill="url(#wheatGold)"/>
      <ellipse cx="7" cy="18" rx="8" ry="14" fill="url(#wheatGold)"/>
      <ellipse cx="-7" cy="36" rx="8" ry="14" fill="url(#wheatGold)"/>
      <ellipse cx="7" cy="36" rx="8" ry="14" fill="url(#wheatGold)"/>
      <ellipse cx="0" cy="54" rx="7" ry="12" fill="url(#wheatGold)"/>
      <line x1="0" y1="-14" x2="0" y2="-40" stroke="#AC770A" stroke-width="1.8"/>
      <line x1="-7" y1="6" x2="-18" y2="-18" stroke="#AC770A" stroke-width="1.8"/>
      <line x1="7" y1="6" x2="18" y2="-18" stroke="#AC770A" stroke-width="1.8"/>
    </g>

    <!-- Wheat Stalk 2 (Center Main) -->
    <path d="M200,260 Q200,160 200,60" stroke="#CCA028" stroke-width="3.5" fill="none"/>
    <g transform="translate(200, 60)">
      <ellipse cx="0" cy="0" rx="10" ry="18" fill="url(#wheatGold)"/>
      <ellipse cx="-8" cy="20" rx="9" ry="16" fill="url(#wheatGold)"/>
      <ellipse cx="8" cy="20" rx="9" ry="16" fill="url(#wheatGold)"/>
      <ellipse cx="-8" cy="40" rx="9" ry="16" fill="url(#wheatGold)"/>
      <ellipse cx="8" cy="40" rx="9" ry="16" fill="url(#wheatGold)"/>
      <ellipse cx="-8" cy="60" rx="8" ry="15" fill="url(#wheatGold)"/>
      <ellipse cx="8" cy="60" rx="8" ry="15" fill="url(#wheatGold)"/>
      <ellipse cx="0" cy="80" rx="8" ry="14" fill="url(#wheatGold)"/>
      <!-- Awns / Whiskers -->
      <line x1="0" y1="-16" x2="0" y2="-45" stroke="#AC770A" stroke-width="2"/>
      <line x1="-8" y1="8" x2="-22" y2="-22" stroke="#AC770A" stroke-width="1.8"/>
      <line x1="8" y1="8" x2="22" y2="-22" stroke="#AC770A" stroke-width="1.8"/>
      <line x1="-8" y1="28" x2="-22" y2="-2" stroke="#AC770A" stroke-width="1.8"/>
      <line x1="8" y1="28" x2="22" y2="-2" stroke="#AC770A" stroke-width="1.8"/>
    </g>

    <!-- Wheat Stalk 3 (Right Tilt) -->
    <path d="M250,260 Q230,170 260,80" stroke="#CCA028" stroke-width="3" fill="none"/>
    <g transform="translate(260, 80) rotate(15)">
      <ellipse cx="0" cy="0" rx="9" ry="16" fill="url(#wheatGold)"/>
      <ellipse cx="-7" cy="18" rx="8" ry="14" fill="url(#wheatGold)"/>
      <ellipse cx="7" cy="18" rx="8" ry="14" fill="url(#wheatGold)"/>
      <ellipse cx="-7" cy="36" rx="8" ry="14" fill="url(#wheatGold)"/>
      <ellipse cx="7" cy="36" rx="8" ry="14" fill="url(#wheatGold)"/>
      <ellipse cx="0" cy="54" rx="7" ry="12" fill="url(#wheatGold)"/>
      <line x1="0" y1="-14" x2="0" y2="-40" stroke="#AC770A" stroke-width="1.8"/>
      <line x1="-7" y1="6" x2="-18" y2="-18" stroke="#AC770A" stroke-width="1.8"/>
      <line x1="7" y1="6" x2="18" y2="-18" stroke="#AC770A" stroke-width="1.8"/>
    </g>
  </g>
  
  <g transform="translate(30, 32)">
    <rect width="112" height="26" rx="13" fill="#1F4D36" fill-opacity="0.9"/>
    <text x="56" y="17" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">GOLDEN GRAIN</text>
  </g>
</svg>