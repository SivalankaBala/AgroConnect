<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPeanut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="50%" stop-color="#F3E9DA"/>
      <stop offset="100%" stop-color="#E5D6BF"/>
    </linearGradient>
    <linearGradient id="shellWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8BE88"/>
      <stop offset="50%" stop-color="#C79659"/>
      <stop offset="100%" stop-color="#8F602B"/>
    </linearGradient>
    <linearGradient id="nutRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9644E"/>
      <stop offset="60%" stop-color="#B23521"/>
      <stop offset="100%" stop-color="#73190B"/>
    </linearGradient>
    <filter id="shadowPeanut">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#503515" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgPeanut)"/>
  <ellipse cx="200" cy="245" rx="140" ry="22" fill="#5A3A15" opacity="0.12"/>
  
  <g filter="url(#shadowPeanut)">
    <!-- Peanut Pod 1 (Closed Left) -->
    <g transform="translate(130, 160) rotate(-25)">
      <path d="M0,20 C-18,5 -22,-20 0,-35 C15,-20 12,0 0,20 Z" fill="url(#shellWood)"/>
      <path d="M0,20 C-12,35 -15,60 0,75 C18,60 15,35 0,20 Z" fill="url(#shellWood)"/>
      <ellipse cx="0" cy="20" rx="6" ry="4" fill="#75481B"/>
    </g>

    <!-- Peanut Pod 2 (Center Opened Shell with Nuts) -->
    <g transform="translate(225, 175) rotate(15)">
      <path d="M-30,-40 C-60,-10 -60,40 -20,70 C-5,50 -10,-10 -30,-40 Z" fill="url(#shellWood)"/>
      <!-- Exposed Red-Skin Groundnut Kernels -->
      <ellipse cx="-18" cy="-5" rx="18" ry="13" fill="url(#nutRed)" transform="rotate(35 -18 -5)"/>
      <ellipse cx="-10" cy="30" rx="19" ry="14" fill="url(#nutRed)" transform="rotate(15 -10 30)"/>
    </g>
    
    <!-- Scattered Single Nut -->
    <ellipse cx="145" cy="225" rx="14" ry="10" fill="url(#nutRed)" transform="rotate(-15 145 225)"/>
    <ellipse cx="270" cy="228" rx="14" ry="10" fill="url(#nutRed)" transform="rotate(25 270 228)"/>
  </g>
  
  <g transform="translate(30, 32)">
    <rect width="138" height="26" rx="13" fill="#1F4D36" fill-opacity="0.9"/>
    <text x="69" y="17" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">AP GROUNDNUTS</text>
  </g>
</svg>